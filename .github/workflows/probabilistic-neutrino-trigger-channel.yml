name: Probabilistic neutrino trigger channel

on:
  push:
    paths:
      - "papers/probabilistic-neutrino-trigger-channel/**"
      - ".github/workflows/probabilistic-neutrino-trigger-channel.yml"
  pull_request:
    paths:
      - "papers/probabilistic-neutrino-trigger-channel/**"
      - ".github/workflows/probabilistic-neutrino-trigger-channel.yml"

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "1787702400"

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: papers/probabilistic-neutrino-trigger-channel
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            papers/probabilistic-neutrino-trigger-channel/pyproject.toml
            papers/probabilistic-neutrino-trigger-channel/requirements-lock.txt

      - name: Install package and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Install pinned Tectonic compiler
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tectonic.tar.gz" \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz"
          echo "1a715688baf591e650c8aeb160ae934e181685eecbb38b317de30b269ac5d606  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/tectonic.tar.gz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run tests
        run: python -m pytest

      - name: Reproduce numerical artifacts
        run: make figures tables reproduce

      - name: Verify generated artifacts are current
        run: |
          git diff --exit-code -- figures results
          test -z "$(git status --porcelain --untracked-files=all -- figures results)"

      - name: Compile paper with Tectonic 0.17.0
        run: |
          rm --force paper/main.pdf
          make paper

      - name: Verify paper was rebuilt
        run: |
          test -s paper/main.pdf
          git diff --exit-code -- paper/main.pdf
          test -z "$(git status --porcelain --untracked-files=all -- paper/main.pdf)"
