[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neutrino-trigger-simulator"
version = "0.1.0"
description = "Offline decision-theoretic feasibility models for a probabilistic neutrino trigger channel"
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
authors = [{name = "AnimaFoundry"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
neutrino-trigger = "neutrino_trigger.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
